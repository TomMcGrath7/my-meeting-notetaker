# Rename to config.yaml (or keep several, one per recurring meeting).
# Everything here is fed to the LLM that maps anonymous SPEAKER_xx labels to
# real people and writes the notes. The richer the context, the better the
# attribution — roles and who-does-what matter more than anything clever.

participants:
  - Tom
  - Marina
  - Viswa

# Free text. Mention roles, the meeting's purpose, who tends to ask vs. answer,
# any self-introductions, accents/phone-vs-room audio, recurring topics, etc.
context: |
  Weekly sync. Tom is the technical lead and runs the agenda — he tends to
  walk through status and propose next steps. Viswa is the client (UK
  compliance SaaS) and mostly asks questions about scope, timeline and cost.
  Marina joins occasionally and is dialing in from a phone, so her audio is
  thinner than the others. Topics this week: API hardening sprint, launch
  timeline, invoicing.

# Optional, `--llm-backend ollama` only. The largest context window, in tokens,
# the notetaker may ask Ollama for. It sizes the window to each meeting, and a
# bigger window is RAM on top of the model itself, so this is the ceiling on
# that. The default (32768) is about 95 minutes of talk and fits a 24 GB Mac
# with a 14B model. A meeting that does not fit stops with an error and the
# numbers; nothing is cut silently. `--num-ctx-max` overrides this.
# num_ctx_max: 32768
